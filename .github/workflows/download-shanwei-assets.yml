name: Download Shanwei video assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install --upgrade pillow
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download Shanwei image assets
        run: python scripts/download_shanwei_assets.py
      - name: Download and trim open-license B-roll videos
        run: python scripts/download_broll_videos.py
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shanwei-video-assets
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Shanwei image and video assets"
            git push
          fi
